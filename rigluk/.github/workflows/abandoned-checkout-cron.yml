name: Abandoned Checkout Email Cron

on:
  schedule:
    - cron: "0 14 * * *"   # Run daily at 14:00 UTC (9 AM EST)
  workflow_dispatch:

jobs:
  send-abandoned-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Send 24-hour abandoned checkout recovery emails via Resend
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_abandoned_checkout.py
