<!-- Visitor Avatar & Web MIDI Status Initializer -->
<script>
    (function() {
        const userEmail = "{{ user.email if user else '' }}";
        
        function initVisitorAvatar() {
            let seed = localStorage.getItem('visitor-avatar-seed');
            
            // Clean up legacy IP seeds and unhashed fingerprints
            if (seed && (seed.includes('.') || seed === '127.0.0.1' || seed === 'localhost' || seed === 'visitor' || !seed.startsWith('km-'))) {
                seed = null;
                localStorage.removeItem('visitor-avatar-seed');
            }
            
            // Set up initial seed if not present
            if (userEmail) {
                seed = userEmail;
            } else if (!seed) {
                // Generate a robust device fingerprinted salt + random component
                const fingerprint = [
                    navigator.userAgent.replace(/[^a-zA-Z0-9]/g, '').slice(-15),
                    screen.width,
                    screen.height,
                    navigator.language,
                    Math.random().toString(36).substring(2, 10)
                ].join('-');
                
                // Simple djb2 hash to obfuscate fingerprint details
                let hash = 5381;
                for (let i = 0; i < fingerprint.length; i++) {
                    hash = ((hash << 5) + hash) + fingerprint.charCodeAt(i);
                }
                
                seed = 'km-' + Math.abs(hash).toString(16);
                localStorage.setItem('visitor-avatar-seed', seed);
            }

            // Update landing pricing card stamp avatar
            const landingAvatarImg = document.getElementById('landing-upgrade-avatar');
            if (landingAvatarImg) {
                landingAvatarImg.src = `https://api.dicebear.com/10.x/pixel-art/svg?seed=${encodeURIComponent(seed)}`;
            }

            // Update landing page hero inline avatar
            const heroAvatarImg = document.getElementById('hero-visitor-avatar');
            if (heroAvatarImg) {
                heroAvatarImg.src = `https://api.dicebear.com/10.x/pixel-art/svg?seed=${encodeURIComponent(seed)}`;
            }

            // Update dashboard upgrade paywall avatar
            const upgradeAvatarImg = document.getElementById('dashboard-upgrade-avatar');
            if (upgradeAvatarImg) {
                upgradeAvatarImg.src = `https://api.dicebear.com/10.x/pixel-art/svg?seed=${encodeURIComponent(seed)}`;
            }

            // Update sidebar user avatar
            const sidebarUserAvatarImg = document.getElementById('sidebar-user-avatar');
            if (sidebarUserAvatarImg) {
                sidebarUserAvatarImg.src = `https://api.dicebear.com/10.x/pixel-art/svg?seed=${encodeURIComponent(seed)}`;
            }

            // Inject mini avatar into footer if visitor-geo-tag exists
            const geoTag = document.getElementById('visitor-geo-tag');
            if (geoTag) {
                if (!document.getElementById('footer-visitor-avatar')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = "flex items-center gap-2 mt-1 justify-center md:justify-start";
                    
                    geoTag.classList.remove('mt-1', 'justify-center', 'md:justify-start');
                    geoTag.classList.add('flex', 'items-center', 'gap-1.5');
                    
                    geoTag.parentNode.insertBefore(wrapper, geoTag);
                    
                    const footerAvatarImg = document.createElement('img');
                    footerAvatarImg.id = 'footer-visitor-avatar';
                    footerAvatarImg.src = `https://api.dicebear.com/10.x/pixel-art/svg?seed=${encodeURIComponent(seed)}`;
                    footerAvatarImg.className = 'w-5 h-5 rounded-full border border-zinc-855 bg-zinc-900 object-cover shrink-0 select-none';
                    footerAvatarImg.alt = 'Visitor Footer Avatar';
                    
                    wrapper.appendChild(footerAvatarImg);
                    wrapper.appendChild(geoTag);
                }
            }
        }

        // Web MIDI Browser Support Badge Injection
        function injectMidiBadge() {
            const container = document.querySelector('header .flex.items-center.gap-4') || document.querySelector('header div > div:last-child');
            if (!container || document.getElementById('web-midi-badge')) return;

            const badge = document.createElement('div');
            badge.id = 'web-midi-badge';
            badge.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-zinc-950/80 border border-zinc-800 rounded-full text-[9px] font-mono tracking-widest text-zinc-400 select-none';

            const dot = document.createElement('span');
            dot.className = 'w-1.5 h-1.5 rounded-full';

            const text = document.createElement('span');
            text.className = 'font-pixel uppercase tracking-widest';

            if (navigator.requestMIDIAccess) {
                dot.className += ' bg-emerald-500 shadow-[0_0_8px_#10b981] animate-pulse';
                text.textContent = 'MIDI: OK';
                badge.title = 'Web MIDI is supported on your browser!';
            } else {
                dot.className += ' bg-rose-500 shadow-[0_0_8px_#f43f5e]';
                text.textContent = 'MIDI: NO';
                badge.classList.remove('border-zinc-800', 'text-zinc-400');
                badge.classList.add('border-rose-950/40', 'text-rose-400', 'bg-rose-950/10');
                badge.style.cursor = 'help';
                badge.title = 'Web MIDI is not supported on Safari or Firefox. Please use Google Chrome, Edge, or Opera.';
            }

            badge.appendChild(dot);
            badge.appendChild(text);
            container.insertBefore(badge, container.firstChild);
        }

        // Run on DOM load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initVisitorAvatar();
                injectMidiBadge();
            });
        } else {
            initVisitorAvatar();
            injectMidiBadge();
        }
    })();
</script>
