<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="300" fill="#FFFFFF" rx="16"/>

  <!-- Spiky Zigzag Hair on Top -->
  <path d="M 110 120 L 125 90 L 140 115 L 160 80 L 180 110 L 200 75 L 220 105 L 240 85 L 255 120 Z" 
        fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Ring: Pyridine 6-ring -->
  <polygon points="120,130 160,110 200,130 200,180 160,200 120,180" 
           fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Pyridine Double Bonds -->
  <line x1="128" y1="137" x2="128" y2="173" stroke="#000000" stroke-width="2.5"/>
  <line x1="165" y1="117" x2="193" y2="133" stroke="#000000" stroke-width="2.5"/>
  <!-- N symbol bottom of 6-ring -->
  <text x="153" y="196" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#000000">N</text>

  <!-- Eye inside Left 6-ring -->
  <circle cx="160" cy="155" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="160" cy="155" r="5" fill="#000000"/>

  <!-- Dashed Bond connecting 6-ring and 5-ring -->
  <line x1="200" y1="130" x2="230" y2="125" stroke="#000000" stroke-width="4" stroke-dasharray="2,3"/>

  <!-- Right Ring: Pyrrolidine 5-ring -->
  <polygon points="230,125 265,100 295,130 280,170 240,165" 
           fill="none" stroke="#000000" stroke-width="4"/>
  <!-- N symbol inside 5-ring -->
  <text x="254" y="168" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#000000">N</text>
  <!-- CH3 symbol below N -->
  <line x1="262" y1="172" x2="262" y2="190" stroke="#000000" stroke-width="3"/>
  <text x="245" y="208" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#000000">CH<tspan font-size="11" dy="3">3</tspan></text>

  <!-- Eye inside Right 5-ring -->
  <circle cx="260" cy="135" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="260" cy="135" r="4.5" fill="#000000"/>

  <!-- Big Curved Smile Underneath -->
  <path d="M 140 225 Q 205 285 270 225" 
        fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
</svg>
