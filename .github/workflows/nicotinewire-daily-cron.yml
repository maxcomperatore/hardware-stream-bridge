name: NicotineWire Weekly Monday AI Ingestion & Publishing

on:
  schedule:
    # Runs every Monday at 08:00 UTC (3:00 AM EST)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual one-click execution from GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r nicotinewire/requirements.txt

      - name: Run NicotineWire 4-Agent Pipeline
        env:
          OPENROUTER_API_KEY: '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'
          OPENROUTER_BASE_URL: 'https://openrouter.ai/api/v1'
          MODEL_NAME: 'deepseek/deepseek-v4-pro'
        run: |
          python nicotinewire/run_pipeline.py

      - name: Commit and Push Updated Intelligence Stories
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nicotinewire/index.html nicotinewire/pricing.html nicotinewire/directory.html nicotinewire/data/
          git diff-index --quiet HEAD || (git commit -m "auto: weekly NicotineWire AI story ingestion [skip ci]" && git push)
