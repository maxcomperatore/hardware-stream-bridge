<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <mask id="arcade-a-mask">
      <!-- Outer A Frame -->
      <polygon points="100,12 16,144 44,144 56,116 144,116 156,144 184,144" fill="#ffffff"/>
      <!-- Joystick Cutout -->
      <circle cx="100" cy="68" r="16" fill="#000000"/>
      <rect x="95" y="68" width="10" height="50" fill="#000000"/>
      <polygon points="68,118 132,118 120,134 80,134" fill="#000000"/>
    </mask>
  </defs>

  <!-- Filled White A Base -->
  <polygon points="100,12 16,144 44,144 56,116 144,116 156,144 184,144" fill="#ffffff" mask="url(#arcade-a-mask)"/>
  
  <!-- Scanline cuts -->
  <g mask="url(#arcade-a-mask)">
    <line x1="0" y1="20" x2="200" y2="20" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="36" x2="200" y2="36" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="44" x2="200" y2="44" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="52" x2="200" y2="52" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="68" x2="200" y2="68" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="76" x2="200" y2="76" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="84" x2="200" y2="84" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="92" x2="200" y2="92" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#000000" stroke-width="2.5"/>
    <line x1="0" y1="108" x2="200" y2="108" stroke="#000000" stroke-width="2.5"/>
  </g>
</svg>
