<!-- PostHog Tracking -->
<script>
    // Ensure essential open graph tags exist to prevent third-party scripts from crashing on querySelector().content
    ['og:type', 'og:title', 'og:description'].forEach(function(prop) {
        if (!document.querySelector("meta[property='" + prop + "']")) {
            var meta = document.createElement('meta');
            meta.setAttribute('property', prop);
            meta.setAttribute('content', prop === 'og:type' ? 'website' : document.title || '');
            document.head.appendChild(meta);
        }
    });

    (function() {
        var posthogKey = {{ posthog_api_key | tojson }};
        if (!posthogKey) {
            return;
        }
        var enableConversations = {{ posthog_enable_conversations | default(false) | tojson }};
        var identityDistinctId = {{ posthog_identity_distinct_id | default(none) | tojson }};
        var identityHash = {{ posthog_identity_hash | default(none) | tojson }};
        var script = document.createElement('script');
        script.src = 'https://us-assets.i.posthog.com/static/1.396.2/array.js';
        script.crossOrigin = 'anonymous';
        script.async = true;
        script.onerror = function() {
            window.posthog = window.posthog || {
                init: function() {},
                identify: function() {},
                capture: function() {},
                on: function() {},
                get_distinct_id: function() { return ''; }
            };
        };
        script.onload = function() {
            try {
                if (!window.posthog || typeof window.posthog.init !== 'function') {
                    return;
                }
                var isMobile = typeof window !== 'undefined' && window.innerWidth < 768;
                var initOptions = {
                    api_host: {{ posthog_api_host | tojson }},
                    ui_host: 'https://us.posthog.com',
                    strict_script_versioning: true,
                    defaults: '2026-05-30',
                    person_profiles: 'identified_only',
                    disable_conversations: !enableConversations || isMobile,
                    before_send: function(event) {
                        if (event && event.event === '$exception') {
                            var val = event.properties && event.properties.$exception_value;
                            if (val && (
                                val.indexOf('Permission denied to access property') !== -1 ||
                                val.indexOf('nodeName') !== -1 ||
                                val.indexOf('Unexpected end of input') !== -1 ||
                                val.indexOf('Script error.') !== -1
                            )) {
                                return null;
                            }
                        }
                        return event;
                    }
                };
                if (identityDistinctId && identityHash) {
                    initOptions.identity_distinct_id = identityDistinctId;
                    initOptions.identity_hash = identityHash;
                }
                window.posthog.init(posthogKey, initOptions);
                if (identityDistinctId) {
                    window.posthog.identify(identityDistinctId, { email: identityDistinctId });
                }
            } catch (err) {
                console.warn('PostHog initialization caught error:', err);
            }
        };
        document.head.appendChild(script);
    })();
</script>
