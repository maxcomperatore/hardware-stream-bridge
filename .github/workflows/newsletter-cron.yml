name: Newsletter Cron

on:
  schedule:
    - cron: "0 14 * * 4"   # Thursdays 14:00 UTC (biweekly skip handled in API)
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send newsletter via Resend (bypass Vercel/Cloudflare 1010)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_newsletter.py
