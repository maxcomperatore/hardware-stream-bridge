name: Drip Email Cron

on:
  schedule:
    - cron: "15 * * * *"   # hourly at :15 UTC
  workflow_dispatch:

jobs:
  send-drips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send drip emails via Resend (bypass Vercel/Cloudflare 1010)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_drips.py
