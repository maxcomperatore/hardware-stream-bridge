{% if banks %}
    {% for bank in banks %}
    <a href="#" id="bank-item-{{ bank.id }}" 
       onclick="selectBank({{ bank.id }}, '{{ bank.name }}', '{{ bank.synth_model }}'); event.preventDefault();"
       class="group flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-white hover:bg-[#141417] transition-all duration-200">
        <span class="truncate flex items-center gap-2">
            <img src="https://unpkg.com/pixelarticons@latest/svg/music.svg" class="h-3.5 w-3.5 opacity-40 group-hover:opacity-100 transition-opacity" style="filter: invert(1);" />
            <span class="truncate">{{ bank.name }}</span>
        </span>
        <span class="text-xs font-lcd text-zinc-600 group-hover:text-zinc-400 transition-colors">{{ bank.patch_count }}</span>
    </a>
    {% endfor %}
{% else %}
    <div class="py-6 text-center select-none">
        <span class="block text-[9px] font-pixel uppercase tracking-wider text-zinc-600">No backups</span>
    </div>
{% endif %}
